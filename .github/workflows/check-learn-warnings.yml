name: Check Learn warnings

on:
  status:

permissions:
  contents: read
  pull-requests: write
  statuses: read

jobs:
  check-warnings:
    name: Learn warnings
    if: |
      github.event.state == 'success' &&
      github.event.context == 'OpenPublishing.Build'

    concurrency:
      group: learn-warnings-${{ github.event.sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest

    steps:
      - name: Find PR for commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          pr_json=$(gh api "repos/$REPOSITORY/commits/$EVENT_SHA/pulls" \
            --jq '[.[] | select(.state == "open" and .base.ref == "main")][0]')
          if [ -z "$pr_json" ] || [ "$pr_json" = "null" ]; then
            echo "No open PR targeting main found for commit $EVENT_SHA"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_number=$(echo "$pr_json" | jq -r '.number')
          pr_head=$(echo "$pr_json" | jq -r '.head.sha')
          if [ "$EVENT_SHA" != "$pr_head" ]; then
            echo "Status event SHA ($EVENT_SHA) does not match PR HEAD ($pr_head)"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "PR: #$pr_number (HEAD: $pr_head)"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$pr_head" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Checkout PR
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ steps.pr.outputs.head_sha }}

      - name: Compare Learn warnings
        if: steps.pr.outputs.found == 'true'
        id: check
        continue-on-error: true
        env:
          BUILD_REPORT_URL: ${{ github.event.target_url }}
          REPORT_PATH: ${{ runner.temp }}/learn-warning-report.md
        run: python3 .github/scripts/check-learn-warnings.py

      - name: Post Learn warning report
        if: |
          always() &&
          steps.pr.outputs.found == 'true' &&
          steps.check.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPORT_PATH: ${{ runner.temp }}/learn-warning-report.md
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s "$REPORT_PATH" ]; then
            printf '## Learn Build warning report\n\nThe warning checker failed before producing a report.\n' \
              > "$REPORT_PATH"
          fi

          printf '\n[Workflow run](%s)\n\n<!-- learn-warning-check -->\n' "$RUN_URL" \
            >> "$REPORT_PATH"

          comment_id=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --jq 'map(select(.body | contains("<!-- learn-warning-check -->"))) | last | .id // empty')

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" \
              --raw-field body="$(cat "$REPORT_PATH")" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file "$REPORT_PATH"
          fi

      - name: Fail for Learn Build findings
        if: steps.check.outcome == 'failure'
        run: exit 1
