name: Regenerate API docs

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download generation packages
        shell: pwsh
        run: |
          dotnet package download _NuGets _DocsMedia mdoc --prerelease `
            --output .artifacts/api-docs/packages `
            --configfile NuGet.Config `
            --source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-libraries-transport/nuget/v3/index.json

      - name: Install platform reference packs
        shell: pwsh
        run: |
          dotnet workload install android ios maccatalyst macos tvos maui `
            --skip-manifest-update `
            --configfile NuGet.Config

      - name: Generate clean ECMA XML and media
        shell: pwsh
        run: |
          $packageRoot = Join-Path $PWD '.artifacts/api-docs/packages'
          $referencesRoot = Join-Path $PWD '.artifacts/api-docs/references'
          $expandedPackagesRoot = Join-Path $PWD '.artifacts/api-docs/expanded-packages'
          New-Item -ItemType Directory -Force -Path $referencesRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $expandedPackagesRoot | Out-Null
          $nuGetsPackages = Get-ChildItem -Path $packageRoot -Filter '_nugets*.nupkg' -File -Recurse
          $docsMediaPackages = Get-ChildItem -Path $packageRoot -Filter '_docsmedia*.nupkg' -File -Recurse
          if (-not $nuGetsPackages) {
            throw 'The transport feed did not provide the requested _NuGets package.'
          }
          if (-not $docsMediaPackages) {
            throw 'The transport feed did not provide the requested _DocsMedia package.'
          }

          $archives = @(Get-ChildItem -Path $packageRoot -Filter '*.nupkg' -File -Recurse)
          $expandedArchives = @{}
          while ($archives.Count -gt 0) {
            $archive = $archives[0]
            $archives = @($archives | Select-Object -Skip 1)
            if ($expandedArchives.ContainsKey($archive.FullName)) {
              continue
            }
            $expandedArchives[$archive.FullName] = $true
            $destination = Join-Path $expandedPackagesRoot ([IO.Path]::GetFileNameWithoutExtension($archive.Name))
            Expand-Archive -Path $archive.FullName -DestinationPath $destination -Force
            $archives += Get-ChildItem -Path $destination -Filter '*.nupkg' -File -Recurse
          }

          Get-ChildItem -Path $expandedPackagesRoot -Filter '*.dll' -Recurse | Sort-Object FullName | ForEach-Object {
            $destination = Join-Path $referencesRoot $_.Name
            if (-not (Test-Path $destination)) {
              Copy-Item -Force $_.FullName $destination
            }
          }

          $referencePaths = @($referencesRoot)
          $packNames = @(
            'Microsoft.NETCore.App.Ref',
            'Microsoft.WindowsDesktop.App.Ref',
            'Microsoft.Android.Ref',
            'Microsoft.iOS.Ref',
            'Microsoft.MacCatalyst.Ref',
            'Microsoft.macOS.Ref',
            'Microsoft.tvOS.Ref',
            'Microsoft.Maui.Controls.Ref'
          )
          foreach ($packName in $packNames) {
            $packPath = Join-Path $env:DOTNET_ROOT "packs/$packName"
            if (-not (Test-Path $packPath)) {
              continue
            }
            $referencePaths += Get-ChildItem -Path $packPath -Directory | ForEach-Object {
              Get-ChildItem -Path (Join-Path $_.FullName 'ref') -Directory -ErrorAction SilentlyContinue
            } | Select-Object -ExpandProperty FullName
          }

          $mdocPath = Get-ChildItem -Path $expandedPackagesRoot -Filter mdoc.dll -Recurse |
            Where-Object { $_.FullName -match '[\\/]tools[\\/]net6\.0[\\/]' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $mdocPath) {
            throw 'The transport feed did not provide mdoc tools/net6.0/mdoc.dll.'
          }

          ./eng/Generate-ApiDocs.ps1 `
            -NuGetsPath $nuGetsPackages.FullName `
            -DocsMediaPath $docsMediaPackages.FullName `
            -MdocPath $mdocPath `
            -ReferencePath $referencePaths `
            -OutputRoot (Join-Path $PWD 'SkiaSharpAPI')

      - name: Commit generated output
        shell: pwsh
        run: |
          git add SkiaSharpAPI .openpublishing.publish.config.json
          if (git diff --cached --quiet) {
            Write-Host 'The generated API tree is already current.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate API docs and media from packages'
          git push origin HEAD:${{ github.ref_name }}
