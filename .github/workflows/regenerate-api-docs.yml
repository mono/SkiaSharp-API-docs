name: Regenerate API docs

on:
  push:
    branches-ignore:
      - main
      - live
    paths:
      - .github/workflows/regenerate-api-docs.yml
      - NuGet.Config
      - tools/Generate-ApiDocs.ps1
  workflow_dispatch:
    inputs:
      branch:
        description: Feature branch to receive the generated ECMA XML
        required: true
        default: mattleibow-generated-api-docs
        type: string
      package_version:
        description: Optional _NuGets package version (latest prerelease when empty)
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]' && ((github.event_name == 'workflow_dispatch' && inputs.branch != 'main' && inputs.branch != 'live') || (github.event_name == 'push' && github.ref_name != 'main' && github.ref_name != 'live'))
    runs-on: windows-latest
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generate clean ECMA XML
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          $arguments = @{}
          if ($env:PACKAGE_VERSION) {
            $arguments.PackageVersion = $env:PACKAGE_VERSION
          }
          ./tools/Generate-ApiDocs.ps1 @arguments

      - name: Commit generated output
        shell: pwsh
        run: |
          git add SkiaSharpAPI .openpublishing.publish.config.json
          if (git diff --cached --quiet) {
            Write-Host 'The generated API tree is already current.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate API docs from _NuGets'
          git push origin HEAD:$env:TARGET_BRANCH
