name: Auto-merge docs PR

on:
  status:
  check_run:
    types: [completed]
  workflow_run:
    workflows: [Check Learn warnings]
    types: [completed]

env:
  DRY_RUN: false

permissions:
  checks: read
  contents: write
  pull-requests: write
  statuses: read

jobs:
  check-and-merge:
    name: Auto-merge docs
    # Re-check after PoliCheck or any other check succeeds. This includes the
    # standalone Learn warning check without duplicating its validation here.
    if: |
      (github.event_name == 'status' &&
       github.event.state == 'success' &&
       github.event.context == 'PoliCheck Scan' &&
       contains(github.event.branches.*.name, 'automation/write-api-docs')) ||
      (github.event_name == 'check_run' &&
       github.event.check_run.conclusion == 'success' &&
       github.event.check_run.name != 'Auto-merge docs' &&
       github.event.check_run.check_suite.head_branch == 'automation/write-api-docs') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'automation/write-api-docs')

    # Only one run at a time per PR commit.
    concurrency:
      group: automerge-${{ github.event.workflow_run.head_sha || github.event.check_run.head_sha || github.event.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Find PR for commit
        id: pr
        env:
          CHECK_BRANCH: ${{ github.event.check_run.check_suite.head_branch }}
          CHECK_SHA: ${{ github.event.check_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
          STATUS_BRANCHES_JSON: ${{ toJSON(github.event.branches.*.name) }}
          STATUS_SHA: ${{ github.event.sha }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "check_run" ]; then
            branch="$CHECK_BRANCH"
            event_sha="$CHECK_SHA"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            branch="$WORKFLOW_BRANCH"
            event_sha="$WORKFLOW_SHA"
          else
            branch=$(printf '%s' "$STATUS_BRANCHES_JSON" |
              jq -r '.[] | select(. == "automation/write-api-docs")' |
              head -1)
            event_sha="$STATUS_SHA"
          fi

          if [ -z "$branch" ]; then
            echo "automation/write-api-docs branch not found in event"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Branch: $branch"

          pr_json=$(gh pr list --repo "${{ github.repository }}" \
            --head "$branch" --state open \
            --json number,headRefOid --jq '.[0]')
          if [ -z "$pr_json" ] || [ "$pr_json" = "null" ]; then
            echo "No open PR found for branch $branch"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pr_number=$(echo "$pr_json" | jq -r '.number')
          pr_head=$(echo "$pr_json" | jq -r '.headRefOid')

          # Only proceed if the status event SHA matches the PR HEAD.
          # Prevents validating a stale commit while a newer one exists.
          if [ "$event_sha" != "$pr_head" ]; then
            echo "Event SHA ($event_sha) does not match PR HEAD ($pr_head), skipping"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "PR: #$pr_number (HEAD: $pr_head)"
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$pr_head" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Checkout automation scripts from main
        if: steps.pr.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check all PR statuses
        if: steps.pr.outputs.found == 'true'
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          IGNORED_STATUSES: Auto-merge docs
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REQUIRED_STATUSES: OpenPublishing.Build,PoliCheck Scan,Learn warnings
          STATUS_ONLY: true
          VALIDATED_SHA: ${{ steps.pr.outputs.head_sha }}
        run: python3 .github/scripts/check-learn-build.py

      - name: Merge PR
        id: merge
        if: |
          steps.pr.outputs.found == 'true' &&
          steps.check.outputs.should_merge == 'true' &&
          env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MERGE_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          echo "Auto-merging PR #$PR_NUMBER (SHA: $MERGE_SHA)..."
          merge_output=$(gh pr merge "$PR_NUMBER" --squash \
            --match-head-commit "$MERGE_SHA" \
            --subject "Update API docs from latest CI build (#$PR_NUMBER)" \
            --body "Auto-merged after all documentation checks passed." 2>&1) || {
            echo "merge_error<<EOF" >> "$GITHUB_OUTPUT"
            echo "$merge_output" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 1
          }

      - name: Dry-run report
        if: |
          steps.pr.outputs.found == 'true' &&
          steps.check.outputs.should_merge == 'true' &&
          env.DRY_RUN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MERGE_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          echo "🔍 DRY RUN: Would merge PR #$PR_NUMBER (SHA: $MERGE_SHA)"
          gh pr comment "$PR_NUMBER" --body \
            "🔍 **Dry run**: Auto-merge check passed — this PR **would** be merged.

          - All status checks green
          - Learn warning check passed
          - PoliCheck passed
          - Commit: $MERGE_SHA

          Set \`DRY_RUN: false\` in the workflow to enable actual merging."

      - name: Post comment on failure
        if: failure() && steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CHECK_REASON: ${{ steps.check.outputs.reason }}
          MERGE_ERROR: ${{ steps.merge.outputs.merge_error }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="⚠️ **Auto-merge blocked**"
          body+="\n"

          # Validation failure
          if [ "$CHECK_REASON" != "All checks passed" ] && [ -n "$CHECK_REASON" ]; then
            body+="\n**Validation**: $CHECK_REASON"
          fi

          # Merge failure (separate from validation)
          if [ -n "$MERGE_ERROR" ]; then
            body+="\n**Merge failed**: $MERGE_ERROR"
            if echo "$MERGE_ERROR" | grep -q "not up to date"; then
              body+="\nThe PR branch needs to be updated with \`main\` before it can be merged."
            fi
          fi

          body+="\n\n[Workflow run]($RUN_URL)"

          printf "$body" | gh pr comment "$PR_NUMBER" --body-file -
